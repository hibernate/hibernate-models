plugins {
	id "java-module"
	id "maven-publish"
}


publishing {
	publications {
		publishedArtifacts( MavenPublication ) {
			from components.java
			pom {
				name = "Hibernate Models"
				description = "A de-typed abstraction over reflection and annotations"
				url = "https://github.com/hibernate/hibernate-models"

				organization {
					name = 'Hibernate.org'
					url = 'https://hibernate.org'
				}

				licenses {
					license {
						name = "Apache License Version 2.0"
						url = "http://www.apache.org/licenses/"
						distribution = "repo"
					}
				}

				scm {
					url = "https://github.com/hibernate/hibernate-models"
					connection = "scm:git:https://github.com/hibernate/hibernate-models.git"
					developerConnection = "scm:git:https://github.com/hibernate/hibernate-models.git"
				}

				issueManagement {
					system = "github"
					url = "https://github.com/hibernate/hibernate-models"
				}

				developers {
					developer {
						id = "hibernate-team"
						name = "The Hibernate Development Team"
						organization = "Hibernate.org"
						organizationUrl = "https://hibernate.org"
					}
				}

			}
		}
	}
	repositories {
		maven {
			name = 'staging'
			url = rootProject.layout.buildDirectory.dir("staging-deploy${File.separator}maven")
		}
		maven {
			name = 'snapshots'
			url = "https://central.sonatype.com/repository/maven-snapshots/"
			// So that Gradle uses the `ORG_GRADLE_PROJECT_snapshotsPassword` / `ORG_GRADLE_PROJECT_snapshotsUsername`
			//  env variables to read the username/password for the `snapshots` repository publishing:
			credentials(PasswordCredentials)
		}
	}
}

tasks.register("releasePrepare") {
	dependsOn publishAllPublicationsToStagingRepository
}
